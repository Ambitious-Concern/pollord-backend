# Custom pg_hba.conf for the db service — same as the official postgres
# image's auto-generated default, plus one extra line at the bottom to let
# the db_backup container authenticate a *replication* connection (needed
# by pg_basebackup) over the docker network. The default image only opens
# replication to localhost, which the backup container isn't.
#
# Still password-gated (scram-sha-256) either way, and the db service is
# not published to the host/internet in docker-compose.prod.yml — this only
# matters within the internal docker network.

local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
