services:
  # wal_archive is a plain named volume (owned by root by default); postgres
  # runs as uid 70 inside the alpine image and needs write access to it for
  # archive_command to succeed. One-off fixup, then it persists for the
  # volume's lifetime.
  wal_archive_init:
    image: alpine:3
    command: ["sh", "-c", "chown -R 70:70 /wal_archive"]
    volumes:
      - wal_archive:/wal_archive

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pollard
      POSTGRES_USER: pollard
      POSTGRES_PASSWORD: pollard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - wal_archive:/wal_archive
      - ./backup/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - archive_timeout=300
    depends_on:
      wal_archive_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollard"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_backup:
    build: ./backup
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: pollard
      POSTGRES_PASSWORD: pollard
      POSTGRES_DB: pollard
      RETENTION_DAYS: 7
    volumes:
      - wal_archive:/wal_archive
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info

  celery_beat:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
  wal_archive:
  db_backups:
