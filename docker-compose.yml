services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pollard
      POSTGRES_USER: pollard
      POSTGRES_PASSWORD: pollard
    ports:
      # Host-side 55432, not 5432 — avoids clashing with a native Postgres
      # install on the host. The app/celery services stay on db:5432
      # internally (docker network), unaffected by this remap.
      - "55432:5432"
    volumes:
      # postgres:18+'s image expects the mount at the parent dir (it manages
      # a major-version-specific subdirectory itself) — mounting at .../data
      # directly, the pre-18 convention, makes the entrypoint refuse to start.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info

  celery_beat:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
