server {
    listen 8000;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    client_max_body_size 100M;

    # Compresses JSON API responses and any static assets served through here.
    # Excluded from the SSE/ws locations below on purpose — gzip buffers output
    # to build its compressed chunks, which reintroduces the latency
    # proxy_buffering off is there to avoid on a live stream.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

    # SSE endpoints (results_stream.py, support_chat_stream.py) — every route
    # ends in /stream. Buffering has to be off here or nginx holds each chunk
    # until its buffer fills instead of flushing it straight to the client,
    # which defeats "live" entirely. The 1-day read timeout is what keeps a
    # long-lived SSE connection open instead of nginx killing it on its own.
    location ~ /stream$ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Real-time voting/chat websocket channel.
    location /ws {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Everything else — plain proxy_pass to the service name, no upstream
    # block needed: Docker's embedded DNS returns one A record per app
    # replica, and nginx round-robins across all of them automatically. This
    # resolves once at nginx startup, so a replica that gets recreated with a
    # new IP isn't picked up until nginx itself restarts — fine at this
    # scale, since nginx restarts on every deploy anyway.
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /health {
        access_log off;
        proxy_pass http://app:8000/health;
    }
}
