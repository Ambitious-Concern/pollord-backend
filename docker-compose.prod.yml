services:
  db:
    image: postgres:18-alpine
    container_name: pollord-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # postgres:18+'s image expects the mount at the parent dir (it manages
      # a major-version-specific subdirectory itself) — mounting at .../data
      # directly, the pre-18 convention, makes the entrypoint refuse to start.
      - postgres_data_v18:/var/lib/postgresql
    networks:
      - pollord-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: pollord-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - pollord-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Connection pooler sitting between the (now 2-replica) app and Postgres.
  # Each app replica keeps its own SQLAlchemy pool (pool_size=20 in
  # app/db/base.py) — without this, that's up to 60 real Postgres backend
  # connections just from the API layer, growing linearly with every future
  # replica. PgBouncer in transaction mode multiplexes all of that down onto
  # DEFAULT_POOL_SIZE real connections. Transaction-mode pooling is why
  # app/db/base.py also sets statement_cache_size=0 on the asyncpg side —
  # without it, prepared statements break once a client can land on a
  # different physical connection every transaction.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pollord-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      # PgBouncer's own default (md5) can't complete auth against Postgres
      # 18's default scram-sha-256 password encryption — confirmed by
      # actually hitting "wrong password type" against this exact db image
      # without it.
      AUTH_TYPE: scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pollord-network
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Scaled to 2 replicas (`deploy.replicas`) — no fixed container_name/host
  # port here, both are incompatible with running more than one instance.
  # nginx below is the new single entry point; point DATABASE_URL in the
  # real .env at pgbouncer:5432 instead of db:5432 for this to take effect.
  app:
    image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      replicas: 2
    env_file:
      - .env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pollord-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # New single entry point, replacing app's old direct 8000:8000 mapping —
  # round-robins across both app replicas (see nginx.conf: plain
  # `proxy_pass http://app:8000` resolves every IP Docker's embedded DNS
  # returns for the service name and load-balances across all of them).
  nginx:
    image: nginx:1.27-alpine
    container_name: pollord-nginx
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - pollord-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Runs the scheduled jobs in app/tasks/celery_app.py's beat_schedule —
  # notably check_election_status, which auto-closes an election once its
  # end_datetime passes. Without these two, elections/tickets never expire
  # on their own; someone has to notice and fix status by hand.
  celery_worker:
    image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: pollord-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      # Docker socket so backup_tasks can exec into the db container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Backup dumps land here; host path survives container rebuilds.
      - /opt/pollord-backend/backups:/opt/pollord-backend/backups
    networks:
      - pollord-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_beat:
    image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: pollord-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - pollord-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # postgres_data holds the pre-upgrade PostgreSQL 15 cluster. It is kept,
  # unmounted, as the rollback path for the 15 -> 18 migration; PG18 cannot
  # read it in place, so the live data lives in postgres_data_v18.
  postgres_data:
  postgres_data_v18:
  redis_data:

networks:
  pollord-network:
    external: true
    name: pollord-network
