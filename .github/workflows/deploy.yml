name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  statuses: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      - name: Patch prod environment
        run: |
          ssh pollord@${{ secrets.SERVER_HOST }} "
            set -e
            cd /opt/pollord-backend
            sed -i 's/^DEBUG=.*/DEBUG=false/' .env
            grep -q '^FILE_STORAGE_BACKEND=' .env \
              && sed -i 's/^FILE_STORAGE_BACKEND=.*/FILE_STORAGE_BACKEND=remote/' .env \
              || echo 'FILE_STORAGE_BACKEND=remote' >> .env
            mkdir -p backups
          "
      - name: Copy compose and nginx config
        run: |
          # nginx.conf is bind-mounted by the nginx service, so it has to ship
          # with the compose file -- otherwise the entry point cannot start and
          # the API is unreachable even though the app containers are healthy.
          scp docker-compose.prod.yml nginx.conf pollord@${{ secrets.SERVER_HOST }}:/opt/pollord-backend/
      - name: Deploy
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          ssh pollord@${{ secrets.SERVER_HOST }} "
            set -e
            cd /opt/pollord-backend
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export REGISTRY=ghcr.io
            export IMAGE_NAME=${IMAGE_NAME_LOWER}
            export IMAGE_TAG=latest

            docker compose -f docker-compose.prod.yml pull

            # Migrate BEFORE swapping the running containers, using a throwaway
            # container rather than 'exec'. A schema-breaking release cannot
            # migrate itself the other way round: the new image refuses to start
            # against the old schema, so there is no running container to exec
            # into, and the migration never runs. 'run --rm' only needs the
            # database to be up.
            docker compose -f docker-compose.prod.yml run --rm app alembic upgrade head

            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -f
          "
